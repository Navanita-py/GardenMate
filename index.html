<!DOCTYPE html>
<html>
<head>
  <title>GardenMate - AI Gardening Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4fdf4; }
    #chatbox { width: 100%; max-width: 600px; margin: auto; background: #fff;
               border: 1px solid #ccc; padding: 20px; border-radius: 10px; }
    .message { margin: 10px 0; }
    .user { color: green; font-weight: bold; }
    .bot { color: #444; }
    textarea { width: 100%; height: 60px; margin-top: 10px; }
    button { margin-top: 5px; padding: 10px 20px; }
  </style>
</head>
<body>
  <div id="chatbox">
    <h2>🌱 GardenMate - Your Gardening AI Assistant</h2>
    <div id="messages"></div>
    <textarea id="input" placeholder="Ask me about your plants..."></textarea><br>
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("input");
      const msg = input.value.trim();
      if (!msg) return;
      addMessage("You", msg, "user");
      input.value = "";

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      addMessage("GardenMate", data.response, "bot");
    }

    function addMessage(sender, text, cls) {
      const div = document.createElement("div");
      div.className = "message " + cls;
      div.innerHTML = `<strong>${sender}:</strong> ${text}`;
      document.getElementById("messages").appendChild(div);
    }
  </script>
</body>
</html>
